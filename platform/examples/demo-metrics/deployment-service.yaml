apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-metrics
  namespace: ex280-lab
  labels:
    app.kubernetes.io/name: demo-metrics
    app.kubernetes.io/part-of: openshift-platform-blueprints
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-metrics
        app.kubernetes.io/part-of: openshift-platform-blueprints
    spec:
      containers:
        - name: demo-metrics
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports:
            - name: http-metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-metrics
  namespace: ex280-lab
  labels:
    app.kubernetes.io/name: demo-metrics
spec:
  selector:
    app.kubernetes.io/name: demo-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
