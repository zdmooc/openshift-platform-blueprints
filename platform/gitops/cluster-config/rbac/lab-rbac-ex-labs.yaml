apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-admin
  labels:
    app.kubernetes.io/part-of: openshift-platform-blueprints
rules:
  - apiGroups: ["", "apps", "batch", "route.openshift.io", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-dev
  labels:
    app.kubernetes.io/part-of: openshift-platform-blueprints
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-ops
  labels:
    app.kubernetes.io/part-of: openshift-platform-blueprints
rules:
  - apiGroups: ["", "apps", "batch", "route.openshift.io", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-admin-binding
  namespace: ex280-lab
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ocp-lab-admins
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: lab-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-dev-binding
  namespace: ex280-lab
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ocp-lab-devs
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: lab-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-ops-binding
  namespace: ex280-lab
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ocp-lab-ops
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: lab-ops
---
