apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-blueprints-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/zdmooc/openshift-platform-blueprints.git
    targetRevision: main
    path: platform/gitops/argocd-apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
