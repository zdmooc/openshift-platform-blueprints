apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-demo-metrics
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: openshift-platform-blueprints
spec:
  project: default
  source:
    repoURL: https://github.com/zdmooc/openshift-platform-blueprints.git
    targetRevision: main
    path: platform/examples/demo-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: ex280-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
